name: CI/CD - Biblioteca Web

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    name: Testes do Backend (Java 17)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Testes unitarios
        run: mvn -B test -Dtest="*ControllerTest" -Dsurefire.failIfNoSpecifiedTests=false

      - name: Teste de integracao
        run: mvn -B test -Dtest="IntegracaoTest" -Dsurefire.failIfNoSpecifiedTests=false

      - name: Todos os testes + relatorio JaCoCo
        run: mvn -B test

      - name: Publicar relatorio de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco

  test-frontend:
    name: Testes e build do Frontend (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm test -- --watchAll=false --passWithNoTests
        env:
          CI: true
      - run: npm run build

  deploy:
    name: Build Docker + testes de aceitacao (extra)
    runs-on: ubuntu-latest
    needs: [ test-backend, test-frontend ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build das imagens
        run: docker compose build

      - name: Subir os containers
        run: docker compose up -d

      - name: Aguardar o backend
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/api/autores && break
            sleep 5
          done

      - name: Testes de aceitacao com curl
        run: |
          AUTOR_ID=$(curl -sf -X POST http://localhost:8080/api/autores \
            -H "Content-Type: application/json" \
            -d '{"nome":"Machado de Assis","nacionalidade":"Brasileira","dataNascimento":"1839-06-21"}' \
            | python3 -c "import sys, json; print(json.load(sys.stdin)['id'])")
          echo "Autor criado: $AUTOR_ID"
          curl -sf -X POST http://localhost:8080/api/livros \
            -H "Content-Type: application/json" \
            -d "{\"titulo\":\"Dom Casmurro\",\"isbn\":\"978-8535910667\",\"anoPublicacao\":1899,\"genero\":\"Romance\",\"autor\":{\"id\":$AUTOR_ID}}"
          curl -sf http://localhost:8080/api/livros/autor/$AUTOR_ID
          curl -sf http://localhost:3000 > /dev/null

      - name: Derrubar os containers
        if: always()
        run: docker compose down -v
